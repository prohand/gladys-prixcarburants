# Weekly update PRs for the npm dependencies (the Gladys SDK first of all) and
# monthly ones for the GitHub Actions. Development tools are grouped in one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The base image is pinned by digest in the Dockerfile: this keeps the tag and
  # the digest moving together instead of the pin going stale.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Stay on the Node major the image ships with (the current LTS): patch and
    # minor releases, security fixes included, still come as PRs. A move to the
    # next major is done by hand.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
